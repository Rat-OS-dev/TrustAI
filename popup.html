<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trust AI</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 420px;
      height: 600px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0b1020;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0b1020;
    }
    .fallback {
      display: none;
      padding: 20px;
      color: #f3f6ff;
      font: 14px/1.5 Arial, sans-serif;
    }
    .fallback a { color: #7c9cff; }
  </style>
</head>
<body>
  <iframe
    title="Trust AI website"
    src="https://rat-os-dev.github.io/TrustAI/"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
  <div class="fallback" id="fallback">
    <strong>Trust AI could not load.</strong>
    <p>Make sure the Trust AI website is published on GitHub Pages and try again.</p>
    <p><a href="https://rat-os-dev.github.io/TrustAI/" target="_blank" rel="noopener noreferrer">Open Trust AI in a new tab</a></p>
  </div>
</body>
</html>
