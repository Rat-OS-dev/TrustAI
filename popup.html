<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trust AI</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 420px;
      height: 600px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0b1020;
      color: #f3f6ff;
      font: 13px/1.4 Arial, sans-serif;
    }
    iframe {
      display: block;
      width: 100%;
      height: 564px;
      border: 0;
      background: #0b1020;
    }
    .toolbar {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid #2c3954;
      background: #10182b;
    }
    .toolbar a { color: #9bb2ff; text-decoration: none; }
    .toolbar a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <iframe
    title="Trust AI website"
    src="https://rat-os-dev.github.io/TrustAI/"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
  <div class="toolbar">
    <a href="https://rat-os-dev.github.io/TrustAI/" target="_blank" rel="noopener noreferrer">
      If the popup does not load, open Trust AI in a tab
    </a>
  </div>
</body>
</html>
