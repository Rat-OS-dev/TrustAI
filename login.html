<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in or Sign up — Trust AI</title>

  <style>
    :root {
      --bg: #0b1020;
      --panel: #141c30;
      --panel-light: #1b2740;
      --text: #f3f6ff;
      --muted: #a8b3ca;
      --accent: #7c9cff;
      --green: #40d6a0;
      --red: #ff737e;
      --border: #2c3954;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    header {
      padding: 24px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: #10182b;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -1px;
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    main {
      width: min(620px, 100%);
      margin: 0 auto;
      padding: 28px 18px 56px;
    }

    .panel {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      margin-bottom: 20px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 1.55rem;
    }

    .description,
    .muted,
    .note {
      color: var(--muted);
    }

    .note {
      font-size: 0.9rem;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #0b1222;
      color: var(--text);
      font: inherit;
    }

    input:focus {
      border-color: var(--accent);
    }

    .primary,
    .secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      text-decoration: none;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: var(--accent);
      color: #0b1020;
    }

    .primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: var(--panel-light);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .full {
      width: 100%;
      margin-top: 18px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 18px 0;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0b1222;
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }

    .tab.active {
      background: var(--accent);
      color: #0b1020;
      border-color: var(--accent);
      font-weight: bold;
    }

    .message {
      min-height: 24px;
      margin-top: 14px;
      overflow-wrap: anywhere;
      color: var(--muted);
    }

    .message.error {
      color: var(--red);
    }

    .message.success {
      color: var(--green);
    }

    footer {
      padding: 20px;
      text-align: center;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      .panel {
        padding: 18px;
      }

      main {
        padding-top: 20px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Trust AI</h1>
    <p>Your fact-checking account</p>
  </header>

  <main>
    <section class="panel">
      <h2 id="formTitle">Create your account</h2>

      <p class="description">
        Create an account to access your Trust AI profile.
      </p>

      <div class="tabs" role="tablist" aria-label="Account access">
        <button
          class="tab active"
          id="signupTab"
          type="button"
          role="tab"
          aria-selected="true"
        >
          Sign up
        </button>

        <button
          class="tab"
          id="loginTab"
          type="button"
          role="tab"
          aria-selected="false"
        >
          Log in
        </button>
      </div>

      <form id="signupForm">
        <label for="name">Full name</label>
        <input
          id="name"
          name="name"
          autocomplete="name"
          required
          maxlength="120"
        />

        <label for="dob">Date of birth</label>
        <input
          id="dob"
          name="dob"
          type="date"
          autocomplete="bday"
          required
        />

        <label for="signupEmail">Email address</label>
        <input
          id="signupEmail"
          name="email"
          type="email"
          autocomplete="email"
          required
          maxlength="254"
        />

        <label for="signupPassword">Password</label>
        <input
          id="signupPassword"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />

        <button class="primary full" id="signupButton" type="submit">
          Create account
        </button>
      </form>

      <form id="loginForm" hidden>
        <label for="loginEmail">Email address</label>
        <input
          id="loginEmail"
          name="email"
          type="email"
          autocomplete="email"
          required
          maxlength="254"
        />

        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <button class="primary full" id="loginButton" type="submit">
          Log in
        </button>
      </form>

      <p
        class="message"
        id="formMessage"
        role="status"
        aria-live="polite"
      ></p>

      <p class="note">
        Your password is handled by Supabase Authentication. Never share it
        with anyone. Your profile and balance are stored separately from
        your sign-in credentials.
      </p>
    </section>
  </main>

  <footer>Trust AI — account access</footer>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://iirxewgecavovbasafud.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_5Rp10ZaSKUEqlLwjYarvpQ_aVs0yh_p";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const signupForm = document.getElementById("signupForm");
    const loginForm = document.getElementById("loginForm");
    const signupTab = document.getElementById("signupTab");
    const loginTab = document.getElementById("loginTab");
    const formMessage = document.getElementById("formMessage");
    const signupButton = document.getElementById("signupButton");
    const loginButton = document.getElementById("loginButton");

    function showMessage(message, type = "") {
      formMessage.textContent = message;
      formMessage.className = "message";

      if (type) {
        formMessage.classList.add(type);
      }
    }

    function setMode(mode) {
      const isSignup = mode === "signup";

      signupForm.hidden = !isSignup;
      loginForm.hidden = isSignup;

      signupTab.classList.toggle("active", isSignup);
      loginTab.classList.toggle("active", !isSignup);

      signupTab.setAttribute("aria-selected", String(isSignup));
      loginTab.setAttribute("aria-selected", String(!isSignup));

      document.getElementById("formTitle").textContent =
        isSignup ? "Create your account" : "Welcome back";

      showMessage("");
    }

    function isValidDateOfBirth(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        return false;
      }

      const date = new Date(`${value}T00:00:00.000Z`);

      return (
        !Number.isNaN(date.getTime()) &&
        date.toISOString().slice(0, 10) === value &&
        date <= new Date()
      );
    }

    async function saveProfile(user, fullName, dateOfBirth) {
      const { data, error } = await supabase
        .from("profiles")
        .update({
          full_name: fullName,
          date_of_birth: dateOfBirth
        })
        .eq("id", user.id)
        .select("id")
        .maybeSingle();

      if (error) {
        throw error;
      }

      if (!data) {
        throw new Error(
          "Your profile record was not created. Please contact support."
        );
      }
    }

    signupTab.addEventListener("click", () => setMode("signup"));
    loginTab.addEventListener("click", () => setMode("login"));

    signupForm.addEventListener("submit", async event => {
      event.preventDefault();

      showMessage("");

      const fullName = document.getElementById("name").value.trim();
      const dateOfBirth = document.getElementById("dob").value;
      const email = document.getElementById("signupEmail")
        .value.trim().toLowerCase();
      const password = document.getElementById("signupPassword").value;

      if (!fullName || fullName.length > 120) {
        showMessage("Enter your name using 1–120 characters.", "error");
        return;
      }

      if (!isValidDateOfBirth(dateOfBirth)) {
        showMessage("Enter a valid date of birth.", "error");
        return;
      }

      if (password.length < 8) {
        showMessage("Your password must have at least 8 characters.", "error");
        return;
      }

      signupButton.disabled = true;
      loginButton.disabled = true;
      signupButton.textContent = "Creating account...";

      try {
        const redirectUrl = new URL(
          "account.html",
          window.location.href
        ).href;

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: redirectUrl,
            data: {
              full_name: fullName,
              date_of_birth: dateOfBirth
            }
          }
        });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error(
            "Supabase did not return an account. Please try again."
          );
        }

        if (data.session) {
          await saveProfile(data.user, fullName, dateOfBirth);

          showMessage("Account created. Opening your account...", "success");
          window.location.href = "account.html";
          return;
        }

        showMessage(
          "Account created. Check your email for the confirmation link. " +
          "After confirming your email, return here and log in to finish " +
          "loading your account profile.",
          "success"
        );

        setMode("login");
        document.getElementById("loginEmail").value = email;
      } catch (error) {
        console.error("Sign-up error:", error);
        showMessage(
          error instanceof Error
            ? error.message
            : "Could not create your account. Please try again.",
          "error"
        );
      } finally {
        signupButton.disabled = false;
        loginButton.disabled = false;
        signupButton.textContent = "Create account";
      }
    });

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();

      showMessage("");

      const email = document.getElementById("loginEmail")
        .value.trim().toLowerCase();
      const password = document.getElementById("loginPassword").value;

      loginButton.disabled = true;
      signupButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          throw error;
        }

        const user = data.user;

        if (!user) {
          throw new Error("No authenticated account was returned.");
        }

        const fullName =
          user.user_metadata?.full_name || "";

        const dateOfBirth =
          user.user_metadata?.date_of_birth || "";

        if (fullName && isValidDateOfBirth(dateOfBirth)) {
          await saveProfile(user, fullName, dateOfBirth);
        }

        window.location.href = "account.html";
      } catch (error) {
        console.error("Login error:", error);
        showMessage(
          error instanceof Error
            ? error.message
            : "Could not log in. Check your details and try again.",
          "error"
        );
      } finally {
        loginButton.disabled = false;
        signupButton.disabled = false;
        loginButton.textContent = "Log in";
      }
    });

    const { data: sessionData } = await supabase.auth.getSession();

    if (sessionData.session) {
      window.location.href = "account.html";
    }

    if (new URLSearchParams(window.location.search).get("mode") === "login") {
      setMode("login");
    }
  </script>
</body>
</html>
